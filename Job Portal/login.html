<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .form-wrapper {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 2.25rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }
    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <div class="mb-4 text-center">
      <h4 class="fw-bold text-dark mb-1">Sign In</h4>
      <p class="text-muted small">Enter Logins Details</p>
    </div>

    <form>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label small fw-semibold text-secondary">Email address</label>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="name@example.com" required>
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
      </div>
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label small fw-semibold text-secondary">Password</label>
        <input type="password" class="form-control" id="exampleInputPassword1" placeholder="••••••••" required>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label small text-muted" for="exampleCheck1">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"><a class="text-white text-decoration-none" href="index.html">Submit</a></button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
